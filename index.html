<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gym Bro</title>
<meta name="description" content="16-bit arcade rest-timer for your gym sets.">
<meta name="theme-color" content="#0d0b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/pressstart.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixelify.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Press Start 2P";src:url(fonts/pressstart.woff2) format("woff2");font-display:block}
@font-face{font-family:"Pixelify Sans";src:url(fonts/pixelify.woff2) format("woff2");font-weight:400 700;font-display:block}
:root{
  --ink:#0d0b1f;--panel:#1b1740;--panel2:#262058;--line:#3b3487;--hi:#5a52b8;
  --yellow:#ffd23f;--yellow2:#c99b12;--red:#ff3b5c;--red2:#b3203f;--cyan:#3ef2ff;--green:#5dff5d;--orange:#ff8c1a;--magenta:#ff4fd8;
  --white:#f4f1ff;--grey:#9a95c9;--dim:#5f5a94;
  --fx:"Press Start 2P",monospace;--fb:"Pixelify Sans",system-ui,sans-serif;
  --gutter:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--white);font-family:var(--fb);font-size:16px;line-height:1.3;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding-top:var(--sat);padding-bottom:var(--sab);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:8px 8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-transform:uppercase}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ---------- arcade buttons ---------- */
.btn{font-family:var(--fx);text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--yellow);color:var(--ink);padding:0 16px;min-height:48px;position:relative;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.28),0 5px 0 var(--yellow2),0 5px 0 3px #000,0 0 0 3px #000;
  transition:transform .06s steps(2),box-shadow .06s steps(2);font-size:10px;margin:3px 3px 8px}
.btn:active,.btn.pressed{transform:translateY(5px);box-shadow:inset 0 4px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.28),0 0 0 var(--yellow2),0 0 0 3px #000}
.btn.red{background:var(--red);color:var(--white);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.28),0 5px 0 var(--red2),0 5px 0 3px #000,0 0 0 3px #000}
.btn.red:active{box-shadow:inset 0 4px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.28),0 0 0 var(--red2),0 0 0 3px #000}
.btn.grey{background:var(--panel2);color:var(--grey);box-shadow:inset 0 4px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.35),0 5px 0 #14112e,0 5px 0 3px #000,0 0 0 3px #000}
.btn.grey:active{box-shadow:inset 0 4px 0 rgba(255,255,255,.1),inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 #14112e,0 0 0 3px #000}
.btn.cyan{background:var(--cyan);color:var(--ink);box-shadow:inset 0 4px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.25),0 5px 0 #1a9aa8,0 5px 0 3px #000,0 0 0 3px #000}
.btn.cyan:active{box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 #1a9aa8,0 0 0 3px #000}
.btn.sq{width:48px;min-height:48px;padding:0}
.btn.sq svg{width:24px;height:24px}
.btn.big{min-height:72px;font-size:22px;width:calc(100% - 6px);letter-spacing:2px}
.btn.block{width:calc(100% - 6px)}
.btn:disabled{opacity:.6}
.icon{width:24px;height:24px;shape-rendering:crispEdges}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:16px var(--gutter) 8px;gap:16px;max-width:560px;margin:0 auto}
.sub{font-family:var(--fx);font-size:10px;color:var(--grey);padding-top:14px;line-height:1.6}
.sub b{color:var(--yellow);font-weight:400;font-size:14px}
.topbar-actions{display:flex;gap:6px;flex:none}

/* ---------- screens ---------- */
.screen{padding:8px var(--gutter) 48px;max-width:560px;margin:0 auto}
.stages{display:flex;flex-direction:column;gap:16px}
.stage{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px 12px 12px;
  background:var(--panel);border:3px solid var(--line);transition:transform .06s steps(2),border-color .1s;
  animation:slidein .28s steps(4) both;animation-delay:calc(var(--i,0)*50ms);position:relative}
.stage::after{content:"";position:absolute;inset:-3px;transform:translate(4px,4px);background:#000;z-index:-1}
.stage:active{transform:translate(4px,4px)}
.stage:active::after{transform:none}
.stage.done{border-color:var(--yellow2)}
.stage.done .sbox svg,.stage.done .sname,.stage.done .skg,.stage.done .sspec{opacity:.5}
.sbox{width:64px;height:64px;background:var(--panel2);position:relative;overflow:hidden;
  background-image:linear-gradient(transparent 70%,rgba(0,0,0,.35) 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px)}
.sbox svg{position:absolute;inset:4px;width:56px;height:56px}
.stamp-clear{position:absolute;left:8px;top:30px;font-family:var(--fx);font-size:11px;color:var(--yellow);text-shadow:2px 2px 0 var(--red),4px 4px 0 #000;transform:rotate(-10deg);
  animation:slam2 .35s steps(4) both;pointer-events:none;z-index:2;white-space:nowrap}
.scode{font-family:var(--fx);font-size:8px;color:var(--ink);background:var(--yellow);display:inline-block;padding:3px 5px 2px;margin-bottom:8px}
.sname{font-family:var(--fx);font-size:10px;line-height:1.6;color:var(--white);text-transform:uppercase}
.sspec{font-family:var(--fb);font-size:14px;color:var(--grey);margin-top:8px;letter-spacing:.5px;text-transform:uppercase}
.sspec b{font-family:var(--fx);font-size:11px;color:var(--white);font-weight:400;margin-right:2px}
.sdots{display:flex;gap:3px;margin-top:8px}
.sdots i{width:10px;height:6px;background:var(--line)}
.sdots i.on{background:var(--yellow)}
.skg{font-family:var(--fx);font-size:38px;color:var(--cyan);text-align:right;text-shadow:3px 3px 0 #000;line-height:1}
.skg small{display:block;font-size:9px;color:var(--grey);margin-top:8px;text-shadow:none}
.center{display:flex;justify-content:center;margin-top:24px}
.empty{font-family:var(--fx);font-size:9px;color:var(--grey);text-align:center;padding:64px 16px;line-height:2.2}

/* ---------- edit rows ---------- */
.row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;background:var(--panel);border:3px solid var(--line);padding:8px 8px 8px 10px;position:relative;
  animation:slidein .28s steps(4) both;animation-delay:calc(var(--i,0)*40ms)}
.row::after{content:"";position:absolute;inset:-3px;transform:translate(4px,4px);background:#000;z-index:-1}
.row .sbox{width:56px;height:56px}
.row .sbox svg{inset:4px;width:48px;height:48px}
.row .sname{font-size:9px}
.row .sspec{font-size:14px;margin-top:4px}
.row .acts{display:flex;gap:2px}
.row .btn.sq{width:44px;min-height:44px;margin:3px 2px 8px}
.row .btn.sq svg{width:20px;height:20px}
.row.bump{animation:bump .25s steps(3)}

/* ---------- session / fight screen ---------- */
.fight{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;gap:12px;
  padding:calc(var(--sat) + 12px) var(--gutter) calc(var(--sab) + 16px);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:8px 8px;max-width:560px;margin:0 auto;left:0;right:0}
.fight.shake{animation:shake .3s steps(2,end)}
.hud{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;min-height:56px}
.hud .name{font-family:var(--fx);font-size:10px;line-height:1.6;color:var(--white);min-width:0;text-transform:uppercase}
.hud .name small{display:block;font-size:8px;color:var(--yellow);margin-bottom:4px}
.arena{position:relative;flex:1;min-height:0;background:var(--panel);border:3px solid var(--line);overflow:hidden;
  background-image:linear-gradient(180deg,#221c52 0,#1b1740 60%,#151238 100%)}
.arena::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.025) 30px 32px)}
.clock{position:absolute;right:12px;top:12px;font-family:var(--fx);font-size:9px;color:var(--green);border:2px solid var(--line);padding:8px 8px 6px;background:rgba(0,0,0,.35);letter-spacing:1px}
.clock i{font-style:normal;animation:blink 1s steps(2) infinite}
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;
  background-image:linear-gradient(45deg,#2a2466 25%,transparent 25%),linear-gradient(-45deg,#2a2466 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2466 75%),linear-gradient(-45deg,transparent 75%,#2a2466 75%);
  background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#1f1a4d;border-top:3px solid #0a0820;
  animation:floorscroll .5s steps(6) infinite}
.fight.resting .floor,.fight.go .floor{animation-play-state:paused}
.sprite{position:absolute;left:50%;bottom:16%;width:min(58vw,236px,70vh - 300px);min-width:120px;aspect-ratio:1;transform:translateX(-50%);transition:transform .25s steps(4),bottom .25s steps(4),left .25s steps(4)}
.sprite svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.sprite svg.f1,.sprite svg.rest{visibility:hidden}
.sprite.alt svg.f0{visibility:hidden}.sprite.alt svg.f1{visibility:visible}
.fight.resting .sprite{transform:translateX(0) scale(.5);left:auto;right:4px;bottom:4%;transform-origin:bottom right}
.fight.resting .sprite svg.f0,.fight.resting .sprite svg.f1{visibility:hidden}
.fight.resting .sprite svg.rest{visibility:visible;animation:breathe 1.2s steps(2) infinite}
.timer{position:absolute;inset:0;display:grid;place-items:center;text-align:center;visibility:hidden;pointer-events:none}
.fight.resting .timer{visibility:visible}
.timer .num{font-family:var(--fx);font-size:clamp(56px,20vw,84px);color:var(--white);text-shadow:4px 4px 0 var(--red),8px 8px 0 #000;line-height:1;transform:translateY(-8px)}
.timer .num.low{color:var(--yellow)}
.timer .num.punch{animation:punch .25s steps(3)}
.timer .lbl{font-family:var(--fx);font-size:10px;color:var(--orange);margin-top:20px;letter-spacing:2px}
.stamp{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(3);opacity:0;font-family:var(--fx);font-size:30px;color:var(--yellow);
  text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;white-space:nowrap;pointer-events:none;z-index:3;text-transform:uppercase}
.stamp.in{animation:slam .38s steps(5) forwards}
.stamp.blink{opacity:1;transform:translate(-50%,-50%) scale(1);animation:blink .34s steps(2) infinite;color:var(--white)}
.stamp.out{animation:stampout .3s steps(3) forwards}
.stamp.cyan{color:var(--cyan);text-shadow:3px 3px 0 var(--hi),6px 6px 0 #000}
.stamp.small{font-size:14px;top:18%}
.score{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--fx);font-size:11px;color:var(--white);text-shadow:2px 2px 0 #000;white-space:nowrap;opacity:0;z-index:3}
.score.in{opacity:1}
.score b{color:var(--yellow);font-weight:400;font-size:14px}
.setpill{display:flex;background:#000;border:3px solid var(--line);padding:3px;gap:3px}
.setpill i{flex:1;font-style:normal;font-family:var(--fx);font-size:18px;text-align:center;padding:14px 0 12px;color:var(--dim);background:var(--panel);position:relative;transition:background .1s steps(2),color .1s steps(2)}
.setpill i.on{background:var(--yellow);color:var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.5)}
.setpill i.cur{background:var(--panel2);color:var(--white);box-shadow:inset 0 0 0 3px var(--cyan);animation:curblink 1s steps(2) infinite}
.setpill i.flash{animation:segflash .5s steps(4)}
.stats{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.stat.hero b{font-size:56px;color:var(--cyan);text-shadow:4px 4px 0 #000}
.stat.hero{padding:12px 6px 10px}
.stat.hero small{font-size:9px;color:var(--white)}
.stat{background:var(--panel);border:3px solid var(--line);padding:10px 6px 8px;text-align:center;position:relative}
.stat::after{content:"";position:absolute;inset:-3px;transform:translate(3px,3px);background:#000;z-index:-1}
.stat b{display:block;font-family:var(--fx);font-size:22px;font-weight:400;color:var(--white);line-height:1;text-shadow:2px 2px 0 #000}
.stat.cyan b{color:var(--cyan)}.stat.yellow b{color:var(--yellow)}
.stat small{display:block;font-family:var(--fx);font-size:7px;color:var(--grey);margin-top:8px;letter-spacing:1px;text-transform:uppercase}
.stat b i{font-style:normal;font-size:12px;color:var(--grey)}
.notes{font-family:var(--fb);font-size:15px;color:var(--grey);line-height:1.3;min-height:0;max-height:40px;overflow:hidden;text-align:center;padding:0 4px}
.controls{position:relative}
.px-particle{position:absolute;width:8px;height:8px;background:var(--yellow);pointer-events:none;z-index:5;left:50%;top:50%}
.subctl{display:flex;gap:8px;justify-content:center;min-height:56px;align-items:center}
.subctl:empty{min-height:56px}
.subctl .btn{flex:1;min-height:44px;font-size:9px;margin:3px 3px 8px}

/* ---------- dialog ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,4,20,.7);opacity:0;transition:opacity .2s steps(4);pointer-events:none}
.backdrop.open{opacity:1;pointer-events:auto}
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--panel);border:4px solid var(--line);border-bottom:0;
  max-height:88vh;overflow:auto;transform:translateY(104%);transition:transform .3s steps(6);padding:0 0 calc(var(--sab) + 20px)}
.dlg.open{transform:none}
.dlg .title{position:sticky;top:0;z-index:2;background:var(--yellow);color:var(--ink);font-family:var(--fx);font-size:10px;padding:10px 12px 10px 16px;display:flex;justify-content:space-between;align-items:center;letter-spacing:1px}
.dlg .title .btn.sq{width:36px;min-height:36px;margin:0;background:var(--ink);color:var(--yellow);box-shadow:0 0 0 2px #000}
.dlg .title .btn.sq:active{transform:translate(1px,1px)}
.dlg .title .btn.sq svg{width:18px;height:18px}
.dlg .body{padding:16px 16px 0}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--fx);font-size:8px;color:var(--grey);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.field label span{color:var(--cyan)}
.field input[type=text],.field textarea{width:100%;background:var(--ink);border:3px solid var(--line);padding:12px 12px;outline:none;color:var(--white);font-family:var(--fb);font-size:19px;font-weight:500}
.field input:focus,.field textarea:focus{border-color:var(--yellow)}
.field textarea{min-height:76px;resize:vertical;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .btn.sq{width:44px;min-height:44px;margin:3px 3px 8px;font-size:16px}
.stepper input{flex:1;min-width:0;text-align:center;background:var(--ink);border:3px solid var(--line);outline:none;font-family:var(--fx);font-size:14px;padding:12px 4px 10px;color:var(--white);height:44px;margin-bottom:5px}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pick button{aspect-ratio:1;background:var(--ink);border:3px solid var(--line);display:grid;place-items:center;transition:transform .06s steps(2)}
.pick button svg{width:80%;height:80%}
.pick button.sel{border-color:var(--yellow);background:var(--panel2)}
.pick button:active{transform:translate(2px,2px)}
.dlg .foot{display:flex;gap:12px;padding:8px 16px 0}
.dlg .foot .btn{flex:1;min-height:52px;font-size:11px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:3px dotted var(--line)}
.opt:last-of-type{border-bottom:0}
.opt .lab{font-family:var(--fx);font-size:9px;line-height:1.7;color:var(--white)}
.opt .sub{font-family:var(--fb);font-size:14px;color:var(--grey);margin-top:2px;line-height:1.25}
.toggle{font-family:var(--fx);font-size:10px;color:var(--yellow);flex:none;min-width:104px;text-align:center;padding:10px 6px 8px;border:3px solid var(--line);background:var(--ink);letter-spacing:1px}
.toggle.off{color:var(--grey)}
.toggle span{color:var(--dim)}
.toggle:active{transform:translate(2px,2px)}

/* ---------- overlays ---------- */
#wipe{position:fixed;inset:0;z-index:60;display:grid;pointer-events:none;overflow:hidden}
#wipe i{background:var(--ink);transform:scale(0);transition:transform .12s steps(3)}
#wipe.in i{transform:scale(1.05)}
#flash{position:fixed;inset:0;z-index:55;background:var(--white);opacity:0;pointer-events:none}
#flash.on{animation:flash .45s steps(3)}
#flash.yellow{background:var(--yellow)}
#crt{position:fixed;inset:0;z-index:70;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:0}
#crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
body.crt #crt{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 28px);transform:translate(-50%,12px);z-index:65;background:var(--yellow);color:var(--ink);
  font-family:var(--fx);font-size:9px;padding:12px 16px 10px;border:3px solid #000;box-shadow:4px 4px 0 #000;opacity:0;transition:opacity .15s steps(2),transform .15s steps(3);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes slidein{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(3)}60%{opacity:1;transform:translate(-50%,-50%) scale(.9)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes slam2{0%{opacity:0;transform:rotate(-10deg) scale(3)}60%{opacity:1;transform:rotate(-10deg) scale(.9)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
@keyframes stampout{to{opacity:0;transform:translate(-50%,-70%) scale(1.2)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes segflash{0%,40%{background:var(--white)}100%{background:var(--yellow)}}
@keyframes curblink{0%,49%{box-shadow:inset 0 0 0 3px var(--cyan)}50%,100%{box-shadow:inset 0 0 0 3px var(--line)}}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px)}100%{transform:translate(0,0)}}
@keyframes floorscroll{from{background-position:0 0,0 12px,12px -12px,-12px 0}to{background-position:-24px 0,-24px 12px,-12px -12px,-36px 0}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes punch{0%{transform:translateY(-8px) scale(1.25)}100%{transform:translateY(-8px) scale(1)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes bump{0%{transform:translateX(0)}50%{transform:translateX(6px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="sub" id="subtitle"></div>
    <div class="topbar-actions">
      <button id="btnEdit" class="btn grey sq" aria-label="Edit"></button>
      <button id="btnSettings" class="btn grey sq" aria-label="Settings"></button>
    </div>
  </header>
  <main id="list" class="screen"></main>
  <main id="edit" class="screen hidden"></main>

  <section id="fight" class="fight hidden" aria-hidden="true">
    <div class="hud">
      <button class="btn grey sq" id="btnClose" aria-label="Exit"></button>
      <div class="name"><small id="fCode"></small><span id="fName"></span></div>
    </div>
    <div class="arena" id="arena">
      <div class="clock" id="clock"></div>
