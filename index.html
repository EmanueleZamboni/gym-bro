<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gym Bro</title>
<meta name="description" content="Minimal dark rest-timer for your gym sets.">
<meta name="theme-color" content="#0a0b0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0a0b0e; --surface:#12141a; --surface2:#1b1e27; --line:#242836;
  --text:#eef0f5; --muted:#7f8597; --accent:#c8ff4d; --accent-rgb:200,255,77;
  --warm:#ff8a3d; --warm-rgb:255,138,61; --danger:#ff5d5d;
  --radius:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.6,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding-top:var(--sat);padding-bottom:var(--sab)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:var(--sat);z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{margin:0;font-size:15px;font-weight:900;letter-spacing:.22em}
.logo span{color:var(--accent)}
.logo small{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.topbar-actions{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;transition:transform .15s var(--ease),background .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.on{background:var(--accent);color:#0a0b0e;border-color:var(--accent)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- screens ---------- */
.screen{padding:4px 16px 40px;max-width:560px;margin:0 auto}
.cards{display:flex;flex-direction:column;gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  transition:transform .18s var(--ease),background .25s,border-color .25s,opacity .3s;
  animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.card:active{transform:scale(.97)}
.card.done{border-color:rgba(var(--accent-rgb),.25);opacity:.55}
.glyph{flex:none;width:58px;height:58px;border-radius:17px;background:var(--surface2);display:grid;place-items:center;
  position:relative;overflow:hidden}
.glyph svg{width:46px;height:46px}
.card.done .glyph svg{opacity:.35}
.glyph .tick{position:absolute;inset:0;display:grid;place-items:center}
.glyph .tick svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s var(--ease) .1s forwards}
.meta{flex:1;min-width:0}
.code{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:600}
.name{font-weight:700;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.spec b{color:var(--text);font-weight:600}
.kg{flex:none;text-align:right;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kg small{font-size:11px;color:var(--muted);margin-left:3px;font-weight:600}
.progress-dots{display:flex;gap:4px;margin-top:6px}
.progress-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.progress-dots i.on{background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.5}
.textbtn{display:block;margin:26px auto 0;padding:12px 20px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;
  border:1px solid var(--line);transition:transform .15s var(--ease)}
.textbtn:active{transform:scale(.95)}
.textbtn.primary{color:#0a0b0e;background:var(--accent);border-color:var(--accent)}
.textbtn.danger{color:var(--danger);border-color:rgba(255,93,93,.3)}

/* ---------- edit rows ---------- */
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 12px 12px 16px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms);transition:transform .25s var(--ease)}
.row .meta{flex:1}
.row .actions{display:flex;gap:6px}
.row .mini{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;transition:transform .15s var(--ease)}
.row .mini:active{transform:scale(.85)}
.row .mini svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row .mini:disabled{opacity:.25}
.row.bump{animation:bump .35s var(--spring)}

/* ---------- session ---------- */
.session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(var(--sat) + 10px) 20px calc(var(--sab) + 22px);
  transform:translateY(102%);transition:transform .5s var(--ease);will-change:transform;overflow:hidden}
.session.open{transform:none}
.session::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(60% 45% at 50% 42%,rgba(var(--accent-rgb),.12),transparent 70%);
  transition:opacity .6s,background .6s;pointer-events:none}
.session.resting::before{background:radial-gradient(60% 45% at 50% 42%,rgba(var(--warm-rgb),.14),transparent 70%)}
.shead{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.shead .meta{text-align:center}
.shead .name{white-space:normal;font-size:19px}
.shead .spec{font-size:13px}
.stage{position:relative;width:min(74vw,320px);aspect-ratio:1;margin:auto;z-index:1}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--warm);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:opacity .4s}
.session.resting .ring .prog{opacity:1}
.diagram{position:absolute;inset:11%;display:grid;place-items:center;transition:opacity .45s,transform .45s var(--ease),filter .45s}
.diagram svg{width:100%;height:100%}
.session.resting .diagram{opacity:.1;transform:scale(.88);filter:blur(2px)}
.diagram svg *{stroke:var(--accent);fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) forwards}
.diagram svg .machine{stroke:var(--muted);stroke-width:5}
.diagram svg .pad{stroke-width:11;stroke:rgba(var(--accent-rgb),.6)}
.diagram svg .thin{stroke-width:3}
.diagram svg :nth-child(1){animation-delay:.05s}.diagram svg :nth-child(2){animation-delay:.12s}.diagram svg :nth-child(3){animation-delay:.19s}
.diagram svg :nth-child(4){animation-delay:.26s}.diagram svg :nth-child(5){animation-delay:.33s}.diagram svg :nth-child(6){animation-delay:.4s}
.diagram svg :nth-child(7){animation-delay:.47s}.diagram svg :nth-child(8){animation-delay:.54s}.diagram svg :nth-child(9){animation-delay:.61s}
.diagram svg :nth-child(10){animation-delay:.68s}.diagram svg :nth-child(11){animation-delay:.75s}.diagram svg :nth-child(12){animation-delay:.82s}
.count{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;transform:scale(.7);
  transition:opacity .35s,transform .45s var(--spring);pointer-events:none}
.count .num{font-size:clamp(64px,22vw,96px);font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.count .lbl{font-size:12px;letter-spacing:.3em;color:var(--warm);font-weight:700;margin-top:6px}
.session.resting .count{opacity:1;transform:none}
.count.go{opacity:1;transform:none}
.count.go .num{color:var(--accent);animation:gopulse .9s var(--spring)}
.count.go .lbl{color:var(--accent)}
.pips{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 14px;position:relative;z-index:1}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:background .3s,border-color .3s,box-shadow .4s,transform .3s var(--spring)}
.pip.cur{border-color:var(--accent);transform:scale(1.15)}
.pip.done{background:var(--accent);border-color:var(--accent);box-shadow:0 0 18px rgba(var(--accent-rgb),.7)}
.pip.pop{animation:pop .6s var(--spring)}
.setlbl{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:18px;position:relative;z-index:1}
.setlbl b{color:var(--text)}
.controls{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:1}
.donewrap{position:relative;width:min(54vw,210px);aspect-ratio:1}
.done-btn{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;background:var(--accent);color:#0a0b0e;
  font-weight:900;font-size:24px;letter-spacing:.16em;
  box-shadow:0 22px 60px -18px rgba(var(--accent-rgb),.8),inset 0 -6px 0 rgba(0,0,0,.12);
  transition:transform .14s var(--ease),background .4s,color .4s,box-shadow .4s;animation:breathe 2.6s ease-in-out infinite}
.done-btn:active{transform:scale(.88);box-shadow:0 8px 30px -14px rgba(var(--accent-rgb),.8),inset 0 -2px 0 rgba(0,0,0,.12)}
.session.resting .done-btn{background:var(--surface2);color:var(--muted);box-shadow:none;animation:none;font-size:15px}
.session.resting .done-btn:active{transform:none}
.burst{position:absolute;inset:0;z-index:1;border-radius:50%;border:3px solid var(--accent);pointer-events:none;animation:burst .75s ease-out forwards}
.particle{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:3}
.restctl{display:flex;gap:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
.session.resting .restctl{opacity:1;transform:none;pointer-events:auto}
.pill{padding:10px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;transition:transform .15s var(--ease)}
.pill:active{transform:scale(.92)}
.notes{position:relative;z-index:1;color:var(--muted);font-size:13px;text-align:center;line-height:1.45;padding:14px 6px 0;min-height:20px}
.flash{position:fixed;inset:0;z-index:30;background:var(--accent);pointer-events:none;opacity:0}
.flash.on{animation:flash .7s ease-out}
.celebrate{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s}
.celebrate.on{opacity:1}
.celebrate div{font-size:26px;font-weight:900;letter-spacing:-.01em;text-align:center;animation:gopulse .8s var(--spring)}
.celebrate small{display:block;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.12em;margin-top:8px;text-transform:uppercase}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(4px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:28px 28px 0 0;
  padding:12px 20px calc(var(--sab) + 22px);max-height:88vh;overflow:auto;transform:translateY(104%);transition:transform .45s var(--ease)}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h2{margin:0 0 16px;font-size:18px;font-weight:800}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:11px;background:var(--surface2);font-weight:800;font-size:20px;transition:transform .12s}
.stepper button:active{transform:scale(.85)}
.stepper input{flex:1;min-width:0;padding:0;text-align:center;background:none;border:0;outline:none;font-weight:800;font-size:17px;width:36px;font-variant-numeric:tabular-nums}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=number]{-moz-appearance:textfield}
.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dgrid button{aspect-ratio:1;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;transition:transform .15s var(--ease),border-color .2s,background .2s}
.dgrid button svg{width:70%;height:70%}
.dgrid button svg *{stroke:var(--muted);fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.dgrid button svg .pad{stroke-width:14}
.dgrid button.sel{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.dgrid button.sel svg *{stroke:var(--accent)}
.dgrid button:active{transform:scale(.9)}
.sheet .btns{display:flex;gap:10px;margin-top:20px}
.sheet .btns .textbtn{margin:0;flex:1;text-align:center}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:last-of-type{border-bottom:0}
.setting .lab{font-weight:600;font-size:15px}
.setting .sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.switch{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translate(-50%,20px);z-index:60;background:var(--text);color:var(--bg);
  padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s,transform .4s var(--spring);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(1)}}
@keyframes burst{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 22px 60px -18px rgba(var(--accent-rgb),.8),inset 0 -6px 0 rgba(0,0,0,.12)}50%{box-shadow:0 26px 80px -14px rgba(var(--accent-rgb),1),inset 0 -6px 0 rgba(0,0,0,.12)}}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
@keyframes gopulse{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 class="logo">GYM<span>BRO</span><small id="subtitle"></small></h1>
    <div class="topbar-actions">
      <button id="btnEdit" class="iconbtn" aria-label="Edit">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button id="btnSettings" class="iconbtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="list" class="screen"></main>
  <main id="edit" class="screen hidden"></main>

  <section id="session" class="session" aria-hidden="true">
    <div class="shead">
      <button class="iconbtn" id="btnClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="meta"><div class="code" id="sCode"></div><div class="name" id="sName"></div><div class="spec" id="sSpec"></div></div>
      <div style="width:42px"></div>
    </div>
    <div class="stage">
      <svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="47"/><circle class="prog" id="ringProg" cx="50" cy="50" r="47" pathLength="1"/></svg>
      <div class="diagram" id="sDiagram"></div>
      <div class="count" id="count"><div><div class="num" id="countNum">90</div><div class="lbl" id="countLbl">REST</div></div></div>
      <div class="celebrate" id="celebrate"><div><span id="celebText"></span><small id="celebSub"></small></div></div>
    </div>
    <div class="pips" id="pips"></div>
    <div class="setlbl" id="setlbl"></div>
    <div class="controls">
      <div class="donewrap" id="donewrap"><button class="done-btn" id="btnDone">DONE</button></div>
      <div class="restctl"><button class="pill" id="btnMinus">-15s</button><button class="pill" id="btnPlus">+15s</button><button class="pill" id="btnSkip">Skip</button></div>
    </div>
    <div class="notes" id="sNotes"></div>
  </section>

  <div class="flash" id="flash"></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
'use strict';
/* =========================== i18n =========================== */
const I18N = {
  en:{workout:"Workout",edit:"Edit exercises",settings:"Settings",sets:"sets",reps:"reps",set:"Set",of:"of",done:"DONE",rest:"REST",go:"GO!",
    skip:"Skip",complete:"Exercise done",allDone:"Workout complete",newWorkout:"New workout",addExercise:"Add exercise",save:"Save",
    delete:"Delete",cancel:"Cancel",code:"Code",name:"Name",kg:"Weight (kg)",restOverride:"Rest for this exercise",useDefault:"default",
    notes:"Notes",diagram:"Diagram",restDefault:"Rest between sets",restDefaultSub:"Countdown that starts when you press DONE",
    sound:"Sound",soundSub:"Short beep, ducks your music like a notification",vibration:"Vibration",
    notify:"System notification",notifySub:"Also fires an Android notification when rest ends. Helps if the screen is off.",
    keepAwake:"Keep screen on",keepAwakeSub:"While an exercise is open",language:"Language",resetData:"Restore default exercises",
    install:"Install app",installSub:"Add to your home screen, full screen and offline",empty:"No exercises yet.\nAdd one from the edit screen.",
    deleteConfirm:"Delete this exercise?",resetConfirm:"Replace all exercises with the defaults?",exercise:"Exercise",

/* =========================== audio =========================== */
const RATE = 22050;
function wavURL(samples){
  const n = samples.length, buf = new ArrayBuffer(44+n*2), v = new DataView(buf);
  const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,RATE,true); v.setUint32(28,RATE*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2, Math.max(-1,Math.min(1,samples[i]))*32767, true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function tone(out, start, dur, f0, f1, vol, decay){
  const s0 = Math.floor(start*RATE), n = Math.floor(dur*RATE);
  let ph = 0;
  for(let i=0;i<n;i++){
    const x = i/n, f = f0 + (f1-f0)*x;
    ph += 2*Math.PI*f/RATE;
    const env = Math.min(1, i/(RATE*0.004)) * Math.pow(1-x, decay);
    out[s0+i] = (out[s0+i]||0) + Math.sin(ph)*vol*env + Math.sin(ph*2)*vol*0.18*env;
  }
}
const SOUNDS = {};
function buildSounds(){
  const beep = new Float32Array(Math.floor(RATE*1.1));
  tone(beep,0.00,0.14,880,880,.7,1.2); tone(beep,0.22,0.14,880,880,.7,1.2); tone(beep,0.44,0.5,1318,1318,.75,1.6);
  SOUNDS.beep = wavURL(beep);
  const pop = new Float32Array(Math.floor(RATE*0.25));
  tone(pop,0,0.09,320,1050,.9,2.2); tone(pop,0.02,0.16,1600,900,.35,3);
  SOUNDS.pop = wavURL(pop);
  const win = new Float32Array(Math.floor(RATE*0.9));
  tone(win,0,0.12,660,660,.6,1); tone(win,0.12,0.12,880,880,.6,1); tone(win,0.24,0.5,1320,1320,.7,1.5);
  SOUNDS.win = wavURL(win);
  const tick = new Float32Array(Math.floor(RATE*0.08));
  tone(tick,0,0.05,1400,1200,.35,4);
  SOUNDS.tick = wavURL(tick);
}
buildSounds();
function play(name){
  if(!state.settings.sound) return;

}

function stepper(id, val, min, max, step){
  return `<div class="stepper" data-step="${id}"><button type="button" data-d="-1">−</button><input type="number" id="${id}" value="${val}" min="${min}" max="${max}" step="${step}" inputmode="decimal"><button type="button" data-d="1">+</button></div>`;
}
function wireSteppers(root){
  root.querySelectorAll('.stepper').forEach(s => {
    const inp = s.querySelector('input'), step = parseFloat(inp.step)||1;
    s.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      let v = (parseFloat(inp.value)||0) + step*parseInt(b.dataset.d);
      v = Math.max(parseFloat(inp.min), Math.min(parseFloat(inp.max), v));
      inp.value = Math.round(v*100)/100; play('tick'); buzz(8);
      inp.dispatchEvent(new Event('input'));
    }));
  });
}

    if(k === 'sound' && s.sound) play('pop');
  }));
  body.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { s.lang = b.dataset.lang; save(); openSettings(); renderList(); if(mode==='edit') renderEdit(); document.documentElement.lang = s.lang; }));
  const inst = $('#sInstall');
  if(inst) inst.addEventListener('click', async () => { if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; closeSheet(); });
  $('#sReset').addEventListener('click', () => { if(confirm(t('resetConfirm'))){ state.exercises = freshExercises(); save(); closeSheet(); setMode('list'); } });
}
$('#btnSettings').addEventListener('click', () => { play('tick'); buzz(10); openSettings(); });

/* =========================== session =========================== */
const S = {ex:null, open:false, resting:false, endAt:0, dur:0, raf:0, timeout:0, interval:0, lastShown:-1, wake:null};
const ses = $('#session');
function openSession(id){
  const e = state.exercises.find(x => x.id === id); if(!e) return;
  S.ex = e; S.open = true; S.resting = false;
  if(isDone(e)) e.doneSets = 0; // reopening a finished exercise starts it again
  $('#sCode').textContent = e.code; $('#sName').textContent = e.name;
  $('#sSpec').innerHTML = `<b>${e.kg} kg</b> · ${e.reps} ${t('reps')} · ${restOf(e)}${t('seconds')} ${t('rest').toLowerCase()}`;
  $('#sNotes').textContent = e.notes || '';
  $('#sDiagram').innerHTML = svgOf(e.diagram);
  $('#btnSkip').textContent = t('skip');
  $('#celebrate').classList.remove('on');
  $('#count').classList.remove('go');
  ses.classList.remove('resting');
  renderPips();
  ses.classList.add('open'); ses.setAttribute('aria-hidden','false');
  pushLayer('session', closeSessionNow);
  requestWake();
  play('tick'); buzz(12);
}
function closeSessionNow(){
  S.open = false; stopTimer(); ses.classList.remove('open','resting'); ses.setAttribute('aria-hidden','true');
  releaseWake(); save(); renderList();
}
function closeSession(){ if(S.open) popLayer(); }
$('#btnClose').addEventListener('click', () => { buzz(8); closeSession(); });

function renderPips(popIndex){
  const e = S.ex;
  $('#pips').innerHTML = Array.from({length:e.sets},(_,k)=>`<div class="pip ${k<e.doneSets?'done':''} ${k===e.doneSets?'cur':''} ${k===popIndex?'pop':''}"></div>`).join('');
  const next = e.doneSets + 1;
  if(isDone(e)) $('#setlbl').innerHTML = `<b>${t('complete')}</b>`;
  else if(S.resting) $('#setlbl').innerHTML = `${t('nextSet')} <b>${next}</b> ${t('of')} ${e.sets}`;
  else $('#setlbl').innerHTML = `${t('set')} <b>${next}</b> ${t('of')} ${e.sets}${next===e.sets?` · ${t('lastSet')}`:''}`;
  $('#btnDone').textContent = S.resting ? t('resting') : t('done');
}

/* the satisfying press */
function burstFX(){
  const wrap = $('#donewrap');
  const b = document.createElement('div'); b.className = 'burst'; wrap.appendChild(b); setTimeout(() => b.remove(), 800);
  const b2 = document.createElement('div'); b2.className = 'burst'; b2.style.animationDelay = '.12s'; b2.style.borderWidth = '1.5px'; wrap.appendChild(b2); setTimeout(() => b2.remove(), 950);
  const n = 14, R = wrap.clientWidth/2;
  for(let i=0;i<n;i++){
    const p = document.createElement('div'); p.className = 'particle';
    const a = (i/n)*Math.PI*2 + (Math.random()-.5)*.5, d = R*(1.35 + Math.random()*.9), sz = 5 + Math.random()*6;
    p.style.width = p.style.height = sz+'px'; p.style.margin = (-sz/2)+'px';
    if(Math.random()<.3) p.style.background = 'var(--text)';
    wrap.appendChild(p);
    p.animate([{transform:`translate(${Math.cos(a)*R*.6}px,${Math.sin(a)*R*.6}px) scale(1)`,opacity:1},
               {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],
              {duration:600+Math.random()*350, easing:'cubic-bezier(.1,.8,.3,1)', fill:'forwards'}).onfinish = () => p.remove();
  }
}
$('#btnDone').addEventListener('click', () => {
  if(!S.open || S.resting) return;
  const e = S.ex;
  e.doneSets = Math.min(e.sets, e.doneSets + 1); save();
  play(isDone(e) ? 'win' : 'pop'); buzz(isDone(e) ? [30,40,30,40,80] : 25);
  burstFX(); renderPips(e.doneSets - 1);
  if(isDone(e)) return finishExercise();
  startRest();
});

function startRest(){
  S.resting = true; S.dur = restOf(S.ex); S.endAt = Date.now() + S.dur*1000; S.lastShown = -1;
  ses.classList.add('resting'); $('#count').classList.remove('go'); $('#countLbl').textContent = t('rest');
  renderPips(); tick();
  S.interval = setInterval(tick, 250);
  S.timeout = setTimeout(tick, S.dur*1000 + 20);
}
function tick(){
  if(!S.resting) return;
  const rem = S.endAt - Date.now();
  const secs = Math.max(0, Math.ceil(rem/1000));
  $('#ringProg').style.strokeDashoffset = Math.max(0, Math.min(1, rem/(S.dur*1000)));
  if(secs !== S.lastShown){
    S.lastShown = secs; const num = $('#countNum'); num.textContent = secs;
    if(secs <= 3 && secs > 0){ play('tick'); num.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:300,easing:'ease-out'}); }
  }
  if(rem <= 0) endRest(true);
  else if(!document.hidden){ cancelAnimationFrame(S.raf); S.raf = requestAnimationFrame(tick); }
}
function stopTimer(){ S.resting = false; clearInterval(S.interval); clearTimeout(S.timeout); cancelAnimationFrame(S.raf); }
function endRest(alarm){
  stopTimer();
  ses.classList.remove('resting');
  if(alarm){
    play('beep'); buzz([220,90,220,90,420]);
    const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    const c = $('#count'); $('#countNum').textContent = t('go'); $('#countLbl').textContent = t('set') + ' ' + (S.ex.doneSets+1);
    c.classList.add('go'); setTimeout(() => c.classList.remove('go'), 1100);
    if(state.settings.notify || document.hidden) notify();
  }
  renderPips();
}
$('#btnSkip').addEventListener('click', () => { if(S.resting){ play('tick'); buzz(10); endRest(false); } });
$('#btnPlus').addEventListener('click', () => { if(S.resting){ S.endAt += 15000; S.dur += 15; play('tick'); buzz(8); tick(); } });
$('#btnMinus').addEventListener('click', () => { if(S.resting){ S.endAt -= 15000; play('tick'); buzz(8); tick(); } });

function finishExercise(){
  const all = state.exercises.every(isDone);
  $('#celebText').textContent = all ? t('allDone') : t('complete');
  $('#celebSub').textContent = S.ex.code + ' · ' + S.ex.kg + ' kg';
  $('#celebrate').classList.add('on');
  $('#sDiagram').style.opacity = .08;
  setTimeout(() => { $('#sDiagram').style.opacity = ''; closeSession(); if(all) setTimeout(() => toast('💪 ' + t('allDone')), 500); }, 1500);
}

/* re-sync after the tab was hidden (timers throttle in background) */
document.addEventListener('visibilitychange', () => { if(!document.hidden){ if(S.resting) tick(); if(S.open) requestWake(); } });

/* wake lock */
async function requestWake(){
  if(!state.settings.wake || !('wakeLock' in navigator) || S.wake) return;
  try{ S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', () => { S.wake = null; }); }catch(e){ S.wake = null; }
}
function releaseWake(){ if(S.wake){ S.wake.release().catch(()=>{}); S.wake = null; } }

/* notification via service worker */
async function notify(){
  if(!('Notification' in window) || Notification.permission !== 'granted' || !navigator.serviceWorker) return;
  try{ const r = await navigator.serviceWorker.ready;
    r.showNotification(t('notifTitle'), {body:`${S.ex.name} · ${t('notifBody')}`, tag:'gymbro-rest', renotify:true, vibrate:[200,100,200], icon:'icons/icon-192.png', badge:'icons/icon-192.png'}); }catch(e){}
}

/* =========================== boot =========================== */
document.documentElement.lang = state.settings.lang;
setMode('list');
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
